<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Service | ProxiFix</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-icon">P</span>
      ProxiFix
    </a>
  </header>

  <main class="container">
    <section class="form-container">
      <div class="form-card">
        <p class="eyebrow">Service booking</p>
        <h1>Request a service</h1>
        <p class="muted">Send your request to the selected verified worker.</p>

        <form id="booking-form">
          <div class="form-group">
            <label for="worker-name">Selected worker</label>
            <input id="worker-name" type="text" readonly>
          </div>

          <div class="form-group">
            <label for="service-category">Service category</label>
            <input id="service-category" type="text" readonly>
          </div>

          <div class="form-group">
            <label for="address">Service address</label>
            <textarea id="address" rows="3" placeholder="Enter your complete home address" required></textarea>
          </div>

          <div class="form-group">
            <label for="description">Describe the problem</label>
            <textarea id="description" rows="4" placeholder="Example: Kitchen tap is leaking" required></textarea>
          </div>

          <div class="form-group">
            <label for="estimated-fare">Estimated budget (₹)</label>
            <input id="estimated-fare" type="number" min="0" placeholder="Example: 300" required>
          </div>

          <br>
          <button class="btn btn-primary" type="submit">Send Booking Request</button>

          <p id="form-message" class="message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ProxiFix. Trusted home services made simple.</p>
  </footer>

  <script type="module" src="js/booking.js"></script>
</body>
</html>
