<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ProxiFix</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-icon">P</span>
      ProxiFix
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="register..html">Create Account</a>
    </nav>
  </header>

  <main class="container">
    <section class="form-container">
      <div class="form-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Login to ProxiFix</h1>
        <p class="muted">Access your customer, worker, or admin account.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              minlength="6"
              required
            >
          </div>

          <br>
          <button class="btn btn-primary" type="submit">Login</button>

          <p id="form-message" class="message"></p>

          <p class="muted" style="margin-top: 20px;">
            Do not have an account?
            <a href="register..html" style="color: #14532d; font-weight: 700;">
              Register here
            </a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ProxiFix. Trusted home services made simple.</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
