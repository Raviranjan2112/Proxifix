services:
  - type: web
    name: proxifix-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proxifix-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      # Set this to your Vercel URL in the Render dashboard after frontend deployment.
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: proxifix-db
    databaseName: proxifix
    user: proxifix_app
    plan: free
    postgresMajorVersion: 16
